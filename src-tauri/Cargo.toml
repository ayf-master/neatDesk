[package]
name = "neatdesk"
version = "0.2.0"
description = "NeatDesk - 让桌面回归清爽"
edition = "2021"
rust-version = "1.77"

[lib]
name = "desktop_clean_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
winreg = "0.52"

[features]
# 生产构建必须启用：用内嵌资源协议替代 dev 服务器。
# 缺失会导致 tauri/build.rs 判定 dev=true，app 去连 http://localhost:1420（白屏/拒绝连接）。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
