  <text x="258" y="308" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif" font-size="172" font-weight="700" fill="#FFFFFF" letter-spacing="-6">ND</text>
